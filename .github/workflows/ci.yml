name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    name: TypeScript checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Resolve compatible security updates (experimental branch only)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/meta-unified-login'
        run: |
          npm pkg set 'dependencies.nodemailer=^10.6.0' 'overrides.nodemailer=$nodemailer'
          npm install --package-lock-only --ignore-scripts
          set +e
          npm audit fix --package-lock-only --ignore-scripts --no-force
          rc=$?
          set -e
          if [ "$rc" -gt 1 ]; then exit "$rc"; fi
          git diff --stat -- package.json package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --json
        continue-on-error: true

      - name: Audit all dependencies
        run: npm audit --json
        continue-on-error: true

      - name: Generate Prisma client
        run: npm run db:generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/instrareply

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/instrareply
          REDIS_URL: redis://localhost:6379
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: test-secret-for-ci-build
          CRON_SECRET: test-secret-for-ci-cron
          ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          RESEND_API_KEY: re_test
          EMAIL_FROM: "InstaReply <login@example.com>"
          META_GRAPH_API_VERSION: v25.0
          INSTAGRAM_APP_ID: test
          INSTAGRAM_APP_SECRET: test
          FACEBOOK_APP_SECRET: test
          WEBHOOK_VERIFY_TOKEN: test

      - name: Save validated compatible security updates
        if: success() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/meta-unified-login'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --quiet -- package.json package-lock.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          git add -- package.json package-lock.json
          git commit -m 'fix: apply compatible dependency security updates'
          git push origin HEAD:refs/heads/feat/meta-unified-login
